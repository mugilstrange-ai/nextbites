name: CI

# Proves the app installs, passes lint and type checks, builds,
# and actually serves the home page with recipe cards.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-run:
    name: Lint, type-check, build and run
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Next.js also type-checks here)
        run: npm run build

      - name: Type-check
        run: npx tsc --noEmit

      - name: Start the app and check the home page
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 -o home.html; then break; fi
            sleep 1
          done
          grep -q "NextBites" home.html
          grep -q "<nav" home.html
          cards=$(grep -o "<article" home.html | wc -l)
          echo "Home page responded 200 with the nav bar and $cards recipe cards"
          test "$cards" -ge 4
